<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOD NON_VANSU</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#06060e;color:#fff;overflow-x:hidden}
#welcome{position:fixed;inset:0;z-index:99;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at center,#1a103a 0%,#06060e 70%)}
.w-box{width:92%;max-width:400px;background:rgba(20,15,40,.85);border:1px solid #2a234a;border-radius:22px;padding:28px 20px;text-align:center;backdrop-filter:blur(10px);box-shadow:0 0 60px rgba(168,85,247,.25)}
.w-icon{width:60px;height:60px;background:#1a1035;border-radius:16px;display:flex;justify-content:center;align-items:center;color:#ff3b7a;font-size:30px;margin:0 auto 14px}
.w-tag{font-size:9px;letter-spacing:3px;color:#ff3b7a}
.w-title{font-size:22px;font-weight:900;margin:10px 0 4px} .w-title span{color:#ff3b7a}
.w-sub{font-size:10px;color:#6b6b9a;margin-top:4px}
.w-desc{font-size:11px;color:#8b8bb5;margin-top:16px}
.btn-enter{margin-top:18px;width:100%;padding:14px;background:linear-gradient(90deg,#ff2e7a,#7d5cff);border:none;border-radius:24px;color:#fff;font-weight:900;cursor:pointer}
#main{display:none;min-height:100vh;background:radial-gradient(circle at top,#1a103a 0%,#06060e 60%);padding:18px}
.top{text-align:center;padding-top:12px}
.avatar-wrap{width:110px;height:110px;margin:0 auto;border-radius:50%;padding:3px;background:linear-gradient(135deg,#ff2e7a,#7d5cff);box-shadow:0 0 30px rgba(255,46,122,.6)}
.avatar-wrap img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#000}
.name{margin-top:12px;font-size:13px;color:#a78bfa}
.brand{font-size:22px;font-weight:900;letter-spacing:2px;margin-top:2px}
.btn-game{margin:16px auto 0;max-width:340px;padding:14px;background:linear-gradient(90deg,#0a0a14,#15112a);border:1px solid #2a234a;border-radius:24px;display:flex;justify-content:center;gap:8px;font-weight:800;font-size:13px}
.search{margin:16px 0}
.search input{width:100%;padding:14px 16px;background:#12112a;border:1px solid #23234a;border-radius:14px;color:#fff;outline:none}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
.sec b{font-size:11px;letter-spacing:1px;color:#a78bfa;border:1px solid #2a234a;padding:6px 12px;border-radius:20px;background:#14112a}
.card{display:flex;align-items:center;gap:12px;background:#14112a;border:1px solid #23234a;border-radius:18px;padding:12px;margin-bottom:10px}
.card img{width:52px;height:52px;border-radius:16px;object-fit:cover;background:#000}
.card .i{flex:1}.card .t{font-size:14px;font-weight:800}.card .d{font-size:10px;color:#8b8bb5;margin-top:2px}
.down{width:40px;height:40px;border-radius:12px;display:flex;justify-content:center;align-items:center;text-decoration:none;color:#fff;background:#0ea5e9}
</style>
</head>
<body>
<div id="welcome">
  <div class="w-box">
    <div class="w-icon">+</div>
    <div class="w-tag">— SYSTEM // SECURE ACCESS —</div>
    <div class="w-title">WELCOME TO <span>MOD NON_VANSU</span></div>
    <div class="w-sub">ACCESS GRANTED • NON_VANSU • CONTENT UPDATED</div>
    <div class="w-desc">KHO LƯU TRỮ MOD VÀ TIỆN ÍCH CỦA NON_VANSU</div>
    <button class="btn-enter" id="btnEnter">+ VÀO WEB NGAY →</button>
  </div>
</div>
<div id="main">
  <div class="top">
    <div class="avatar-wrap">
      <!-- FIX AVATAR: Tự nhận cả .jpg .webp .jpg.webp -->
      <img src="avatar.jpg" alt="" onerror="if(this.src.includes('avatar.jpg')){this.src='avatar.jpg.webp'}else if(this.src.includes('jpg.webp')){this.src='avatar.webp'}else{this.src='https://i.pravatar.cc/300'}">
    </div>
    <div class="name">Non_Vansu</div>
    <div class="brand">† NS MOD †</div>
    <div class="btn-game">↑ TẢI GAME NGAY ↑</div>
  </div>
  <div class="search"><input id="q" type="text" placeholder="Tìm file, game, mod..."></div>
  <div class="sec"><b>⭐ YÊU THÍCH</b><b>MỚI</b></div>
  <div id="list">
    <div class="card file">
      <!-- FIX LOGO: Dùng link CDN chuẩn TikTok, không cần file gtiktok.jpg nữa -->
      <img src="https://cdn.pixabay.com/photo/2021/06/15/12/28/tiktok-3338011_1280.png" alt="GTikTok" style="background:#000;padding:6px">
      <div class="i"><div class="t">GTikTok</div><div class="d">• TOOL TIKTOK MOD • BẢN MỚI NHẤT</div></div>
      <a class="down" href="https://drive.google.com/file/d/1Ih6sa7jrNiMsoASpBCZnqXEsmgekrJcJ/view" target="_blank">☁️</a>
    </div>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('btnEnter').addEventListener('click', function(){
    document.getElementById('welcome').style.display='none';
    document.getElementById('main').style.display='block';
  });
  document.getElementById('q').addEventListener('keyup', function(){
    let v=this.value.toLowerCase();
    document.querySelectorAll('.file').forEach(c=>{
      c.style.display=c.innerText.toLowerCase().includes(v)?'flex':'none'
    })
  })
})
</script>
</body>
</html>
