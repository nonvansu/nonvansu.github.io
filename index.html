<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOD NON_VANSU</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: -apple-system, BlinkMacSystemFont, sans-serif}
body{background:#07070f;color:#fff;padding:16px;min-height:100vh}
.container{max-width:700px;margin:0 auto}
.header{text-align:center;padding:20px 0}
.logo{width:64px;height:64px;background:#15112a;border-radius:18px;display:flex;justify-content:center;align-items:center;color:#a855f7;font-size:32px;margin:0 auto 10px}
h1{font-size:26px} h1 span{color:#a855f7}
.search{margin:20px 0}
.search input{width:100%;padding:15px 18px;background:#12121f;border:1px solid #23233a;border-radius:14px;color:#fff;outline:none}
.badge{display:inline-block;padding:6px 14px;background:#14112a;border-radius:20px;font-size:11px;color:#8b7ad8;border:1px solid #2a234a;margin:22px 0 10px;letter-spacing:1px}
.title{font-size:18px;font-weight:900;margin:18px 0 12px}

/* KHUNG CARD */
.card{
  background:#13112a;border:1px solid #2a264a;border-radius:22px;
  padding:14px 14px;display:flex;align-items:center;gap:12px;margin-bottom:12px
}
.card img{width:52px;height:52px;border-radius:14px;background:#fff;object-fit:cover}
.info{flex:1}
.name{font-weight:800;font-size:14px}
.sub{font-size:11px;color:#8a8ab0;margin-top:2px}
.tags{margin-top:6px;display:flex;gap:6px}
.t{font-size:10px;padding:4px 9px;border-radius:12px;background:#1d1a36;border:1px solid #332e5a}
.btn{width:46px;height:46px;border-radius:16px;display:flex;justify-content:center;align-items:center;text-decoration:none;font-size:18px}
.btn.purple{background:#a855f7;box-shadow:0 0 15px rgba(168,85,247,.6);color:#fff}
.btn.blue{background:#0ea5e9;box-shadow:0 0 15px rgba(14,165,233,.6);color:#fff}
.empty{border:1px dashed #2a264a;border-radius:18px;padding:20px;text-align:center;color:#5a5a7a;font-size:12px;margin-bottom:12px}
</style>
</head>
<body>
<div class="container">

<div class="header">
<div class="logo">+</div>
<h1>WELCOME TO <span>MOD NON_VANSU</span></h1>
</div>

<div class="search"><input id="q" onkeyup="search()" type="text" placeholder="Tìm file, game, mod..."></div>

<div class="badge">🌐 TRICK LỒ FACEBOOK // NS MOD</div>
<div class="title">📦 TÀI NGUYÊN TẢI XUỐNG</div>

<!-- KHO TRỐNG - ÔNG THÊM FILE Ở DƯỚI NÀY -->
<div id="list">

<!-- MẪU ĐỂ ÔNG COPY KHI THÊM FILE MỚI:
<div class="card">
  <img src="LINK_ICON" alt="">
  <div class="info">
    <div class="name">TÊN FILE / APP</div>
    <div class="sub">• MÔ TẢ NGẮN</div>
    <div class="tags"><div class="t">🍎 iOS</div></div>
  </div>
  <a class="btn blue" href="LINK_TẢI_DRIVE" target="_blank">☁️</a>
</div>
-->

<div class="empty">Kho đang trống - Thêm file bằng cách copy mẫu ở trong code</div>

</div>

</div>

<script>
function search(){
  let v=document.getElementById('q').value.toLowerCase();
  document.querySelectorAll('#list .card').forEach(c=>{
    c.style.display=c.innerText.toLowerCase().includes(v)?'flex':'none'
  })
}
</script>
</body>
</html>
