<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Non_Vansu</title>
<style>
  body{
    margin:0;min-height:100vh;background:#000;color:#fff;
    display:flex;justify-content:center;align-items:center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .card{
    width:88%;max-width:380px;text-align:center;
    padding:34px 22px;background:#101010;
    border:1px solid #222;border-radius:28px;
    box-shadow:0 0 50px rgba(255,255,255,0.08)
  }
  .avatar{
    width:140px;height:140px;border-radius:50%;
    border:3.5px solid #fff;object-fit:cover;
    box-shadow:0 0 30px rgba(255,255,255,0.7);
    display:block;margin:0 auto
  }
  .name{font-size:31px;font-weight:900;letter-spacing:2px;margin:18px 0 6px;text-shadow:0 0 15px #fff}
  .sub{font-size:13px;opacity:.45;margin-bottom:26px;letter-spacing:1px}
  .btn{
    display:block;width:100%;padding:16px 0;margin:12px 0;
    background:#fff;color:#000;text-decoration:none;
    border-radius:40px;font-weight:900;font-size:15px;
    letter-spacing:.5px
  }
  .btn:active{transform:scale(0.97)}
</style>
</head>
<body>
  <div class="card">
    <img class="avatar" src="avatar.jpg" alt="Non_Vansu">
    <div class="name">Non_Vansu</div>
    <div class="sub">WELCOME TO MY BIO</div>
    
    <a class="btn" href="https://drive.google.com/file/d/1Ih6sa7jrNiMsoASpBCZnqXEsmgekrJcJ/view" target="_blank">TẢI GAME NGAY 🔥</a>
  </div>
</body>
</html>
